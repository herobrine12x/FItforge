<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartGym - Workout Recommender & Progress Tracker</title>
    <meta name="description" content="An OOP-driven fitness application featuring automated BMI health profiling, smart 5-exercise workout split recommendations, live session stopwatches with rest countdown timers, complete workout history CRUD management, and PDF/CSV report exports." />
    <meta property="og:title" content="SmartGym - Workout Recommender & Progress Tracker" />
    <meta property="og:description" content="An OOP-driven fitness application featuring automated BMI health profiling, smart 5-exercise workout split recommendations, live session stopwatches with rest countdown timers, complete workout history CRUD management, and PDF/CSV report exports." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('fitforge_theme');
          var isDark = stored ? stored === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
